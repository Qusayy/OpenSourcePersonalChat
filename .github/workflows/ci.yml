name: CI

# The interface is built here, not on the server: the server pulls finished
# files and never runs Node.
#
# Every push to master and every pull request is type-checked, linted, tested
# and built, and the built interface is driven in a browser against the real
# server. A push to master that passes all of that is then published: the
# files the `web` job built are committed to the `release` branch, which is
# what a server pulls (scripts/publish_release.sh).
#
# Every action is pinned to a commit, with its release beside it; a tag can
# be moved, a commit cannot.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Interface (types, lint, unit tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 7

  server:
    name: Server (unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
      # Everything but llama.cpp, which takes minutes to compile and which
      # nothing here calls: the tests run without a model.
      - run: |
          grep -v '^llama-cpp-python' requirements.txt > requirements-ci.txt
          pip install -r requirements-ci.txt
          # What reads deploy/templates/*.jinja in the tests, as llama-server will.
          pip install jinja2
      - run: python -m unittest discover -s tests -t .

  sandbox:
    name: Sandbox (real programs under bubblewrap)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          grep -v '^llama-cpp-python' requirements.txt > requirements-ci.txt
          pip install -r requirements-ci.txt
      # Ubuntu 24.04 keeps unprivileged user namespaces behind AppArmor; the
      # server (Debian 12) has them on. bubblewrap needs them. The install
      # script tries the jail as the app's own user, so that user is made.
      - run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin aurora
          sudo apt-get update -q
      # The sandbox as the server installs it: bubblewrap, its read-only venv
      # and the seccomp filter in /opt/aurora-sandbox, and the script's own
      # checks of the jail.
      - run: bash deploy/build-sandbox.sh
      - run: python -m unittest tests.test_sandbox -v
        env:
          AURORA_SANDBOX_TESTS: "1"

  browser:
    name: Browser (the built interface on the real server, mock mode)
    runs-on: ubuntu-latest
    env:
      CI: "true"
      # Playwright starts the server itself; this is the interpreter it uses.
      AURORA_PYTHON: python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
      # Mock mode needs no model and no llama.cpp: the engine imports it only
      # when there is a model to load.
      - run: |
          grep -v '^llama-cpp-python' requirements.txt > requirements-ci.txt
          pip install -r requirements-ci.txt
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Browser tests
        run: npm run e2e
        working-directory: web
      # The same tests under a made-up hostname, so the page is not a secure
      # context: no navigator.clipboard, no crypto.randomUUID. That is how the
      # site is reached at http://<server ip>, and localhost hides it.
      - name: Browser tests, insecure context
        run: npm run e2e
        working-directory: web
        env:
          AURORA_E2E_INSECURE: "1"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7

  release:
    name: Publish the built files to the release branch
    # Only what is on master, and only once everything above has passed.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [web, server, sandbox, browser]
    runs-on: ubuntu-latest
    # The one job that may write to the repository, and so the one that runs
    # nothing from npm: it publishes what the read-only `web` job built.
    permissions:
      contents: write
    # One publish at a time, in order, and never cut off halfway.
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      # No token left in the clone's config; the push alone is given one.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # A run can be overtaken: by the time its tests pass, master may have
      # moved, or an older run may be re-run by hand. Publishing it then would
      # put older code on top of newer. Only master's tip is published; the
      # run for the newer commit publishes that one.
      - name: Is this still master's tip?
        id: tip
        run: |
          tip="$(git ls-remote origin refs/heads/master | cut -f1)"
          if [ "$tip" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::master is now $tip; this run is for $GITHUB_SHA and publishes nothing."
          fi
      # The interface the `web` job built and tested, from this same run.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: steps.tip.outputs.current == 'true'
        with:
          name: web-dist
          path: web/dist
      - name: Publish
        if: steps.tip.outputs.current == 'true'
        env:
          RELEASE_SKIP_BUILD: "1"
          RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/publish_release.sh
