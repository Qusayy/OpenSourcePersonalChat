# nginx site for Aurora.
#
# The one setting that matters most: proxy_buffering off on the SSE endpoints.
# With buffering on, nginx holds every token until the response completes, the
# stream arrives as one lump, and the whole live-metrics premise of this site
# quietly stops working. It is the single most common way this deploy breaks.

upstream aurora {
    server 127.0.0.1:8000;
    keepalive 8;
}

server {
    listen 80;
    server_name _;

    # certbot will rewrite this block for TLS; keep the locations as they are.

    client_max_body_size 1m;
    gzip on;
    # A script is sent as application/javascript or as text/javascript,
    # depending on the Python that serves it; both are named.
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # The built interface: plain files under web/dist/assets, which exist only
    # on the `release` branch. Let nginx serve them and skip Python. Each is
    # named for its contents (index-BMSTREQI.css), so a new build is a new
    # name and a file can be kept for a year without ever being asked about
    # again. The page that names them is not here: it comes from the app,
    # which sends it with `Cache-Control: no-cache`.
    #
    # A file that is not there is a 404 and nothing else. A browser still
    # holding last week's page asks for last week's names, and must not be
    # handed the page instead of a script.
    location /assets/ {
        # `root`, not `alias`: /assets/x is /srv/aurora/web/dist/assets/x
        # either way, and try_files is only dependable with root.
        root /srv/aurora/web/dist;
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Streaming endpoints.
    location ~ ^/api/(chat|bench/run) {
        proxy_pass http://aurora;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;          # <- the important one
        proxy_cache off;
        gzip off;                     # gzip would re-buffer the stream
        chunked_transfer_encoding on;

        # A long benchmark run holds the connection for minutes.
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    location / {
        proxy_pass http://aurora;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
